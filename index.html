<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./main.js" defer></script>
    <title>DevBoard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Welcome to DevBoard</h1>

    <div id="counter">
      <div id="totalTickets"></div>
      <div id="openTickets"></div>
      <div id="closedTickets"></div>
    </div>
    <select id="ticketFilter">
      <option value="all">All</option>
      <option value="open">Open</option>
      <option value="closed">Closed</option>
    </select>
    <select id="sortOrder">
      <option value="asc">Sort Ascending</option>
      <option value="desc">Sort Descending</option>
    </select>
    <input type="text" id="inputField" placeholder="Type Ticket..." />
    <button id="submitButton">Submit</button>
    <input type="text" id="searchInput" placeholder="Search tickets..." />
    <div id="output"></div>
  </body>
</html>
